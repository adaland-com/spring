spring:
  datasource:
    url: jdbc:h2:mem/unit_test_db
    username: sa
    password:
  jpa:
    database: H2
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    test:
      database:
        replace: none
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000
security:
  jwt:
    expiration-minutes: 60
    secret-key: ${SECRET_KEY}

